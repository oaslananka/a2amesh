name: Release Please

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.16.0'

jobs:
  release-pr:
    name: Release Please / pull-request
    if: github.repository == 'oaslananka/a2amesh'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - name: Validate release config
        run: node scripts/check-release-config.mjs
      - name: Verify current release is reconciled
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.mjs --mode release-please --json
      - name: Verify published component tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -e "const m=require('./.release-please-manifest.json'); const versions=[...new Set(Object.values(m))]; if (versions.length !== 1) process.exit(1); process.stdout.write(versions[0]);")"
          CANONICAL_TAG="@a2amesh/runtime-v${VERSION}"
          if ! git rev-parse --verify --quiet "${CANONICAL_TAG}^{commit}" >/dev/null; then
            echo "No canonical tag for ${VERSION}; component-tag verification is not applicable."
            exit 0
          fi
          RELEASE_COMMIT="$(git rev-parse "${CANONICAL_TAG}^{commit}")"
          node scripts/sync-release-component-tags.mjs \
            --repo "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --commit "${RELEASE_COMMIT}" \
            --verify-only
      - name: Create or update release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
          repo-url: ${{ github.repository }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true
          skip-github-release: true
          skip-labeling: true
      - name: Determine release pull request branch
        id: release_pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          echo "branch=$(node -e "process.stdout.write(JSON.parse(process.env.PR_JSON).headBranchName)")" >> "$GITHUB_OUTPUT"
      - name: Checkout release pull request branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.release_pr.outputs.branch }}
          persist-credentials: false
      - name: Sync generated files and release policies
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "Release Please branch must be clean before release-policy synchronization."
            git status --short
            exit 1
          fi
          (cd packages/cli && node ../../scripts/build-tsc-package.mjs --generated-only)
          node scripts/sync-compatibility-docs.mjs
          node scripts/sync-security-policy.mjs
          node scripts/sync-release-pr-policy.mjs --clear-release-as --sync-install-docs
          UNTRACKED="$(git ls-files --others --exclude-standard)"
          if [ -n "${UNTRACKED}" ]; then
            echo "Release-policy synchronization created unexpected untracked files."
            printf '%s\n' "${UNTRACKED}"
            exit 1
          fi
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git commit -m "chore: sync generated files and release policy with release version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:${{ steps.release_pr.outputs.branch }}"
