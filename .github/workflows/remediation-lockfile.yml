name: Remediation Artifacts

'on':
  push:
    branches:
      - chore/audit-remediation-20260904
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remediation-artifacts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '24.16.0'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
      - name: Regenerate dependency and evidence artifacts
        run: |
          pnpm install --lockfile-only
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/repo-maturity-report.md')
          text = path.read_text()
          text = text.replace(
              'Renovate policy and Dependabot security updates are enabled and validated.',
              'Renovate policy is primary; Dependabot security updates are currently disabled while audit/OSV/dependency-review gates remain enforced.',
          )
          text = text.replace(
              'Security updates enabled; no version config.',
              'Security updates disabled; no version config; Renovate is the update bot.',
          )
          text = text.replace(
              '| Dependabot alerts/security      | Current Dependabot security-update state is generated above.                  | Remain enabled.                                       | Passed  | Low    | Refresh generated settings evidence.       |',
              '| Dependabot alerts/security      | Current Dependabot security-update state is generated above.                  | Keep the chosen bot policy explicit and security gates enforced.             | Partial | Low    | Reassess enabling security updates without duplicating Renovate. |',
          )
          path.write_text(text)
          PY
          node scripts/repository-evidence.mjs --write --input docs/governance/repository-evidence.json
      - name: Verify remediation artifacts
        run: |
          pnpm audit --audit-level high
          pnpm run repository:evidence:check
          git diff --check
          git diff --exit-code -- pnpm-workspace.yaml docs/governance/repository-evidence.json docs/agent-plugin.md
          git status --short
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- pnpm-lock.yaml docs/repo-maturity-report.md; then
            echo 'Generated artifacts already canonical.'
            exit 0
          fi
          git config user.name 'oaslananka-ops[bot]'
          git config user.email 'oaslananka-ops[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml docs/repo-maturity-report.md
          git commit -m 'fix: regenerate patched dependency and evidence artifacts'
          git push origin HEAD:${GITHUB_REF_NAME}
