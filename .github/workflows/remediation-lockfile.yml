name: Remediation Lockfile

'on':
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remediation-lockfile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '24.16.0'
  GO_VERSION: '1.26.2'
  OSV_SCANNER_VERSION: 'v2.3.8'

jobs:
  regenerate-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - name: Regenerate canonical lockfile
        run: |
          pnpm install --lockfile-only
          node scripts/check-workspace-declarations.mjs
          pnpm install --frozen-lockfile
          git diff --check
      - name: Persist lockfile through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already canonical.'
            exit 0
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml?ref=${GITHUB_REF_NAME}" --jq .sha)"
          LOCKFILE_SHA="$sha" python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          payload = {
              'message': 'fix: regenerate patched dependency lockfile',
              'content': base64.b64encode(Path('pnpm-lock.yaml').read_bytes()).decode(),
              'branch': os.environ['GITHUB_REF_NAME'],
              'sha': os.environ['LOCKFILE_SHA'],
          }
          Path('/tmp/lockfile-payload.json').write_text(json.dumps(payload))
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml" --input /tmp/lockfile-payload.json
      - name: Install OSV Scanner
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
      - name: Run OSV Scanner
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml .
      - name: Run pnpm audit
        run: pnpm audit --audit-level high
