name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '24.16.0'
  CODECOV_CLI_VERSION: 'v11.3.1'

jobs:
  identity:
    name: CI / identity
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - run: pnpm run lint:identity

  install:
    name: CI / install
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

  lint:
    name: CI / lint
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm run lint

  typecheck:
    name: CI / typecheck
    needs: [build]
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - run: pnpm run typecheck:no-build

  unit:
    name: CI / unit
    needs: [build]
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODECOV_BUNDLE_BRANCH: ${{ github.head_ref || github.ref_name }}
      CODECOV_BUNDLE_PR: ${{ github.event.pull_request.number || '' }}
      CODECOV_BUNDLE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      CODECOV_BUNDLE_SLUG: ${{ github.repository }}
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - run: pnpm run test:coverage:ci:no-build
      - name: Publish package coverage summary
        if: ${{ !cancelled() }}
        run: cat coverage/package-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-coverage-${{ github.run_attempt }}
          path: |
            coverage/package-summary.json
            coverage/package-summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          flags: unit
          name: unit-coverage
          version: ${{ env.CODECOV_CLI_VERSION }}
      - name: Upload unit test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./test-results/unit.junit.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
          flags: unit
          name: unit-tests
          version: ${{ env.CODECOV_CLI_VERSION }}
      - name: Upload JavaScript bundle analysis to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          CODECOV_BUNDLE_ANALYSIS: 'true'
        run: pnpm run codecov:bundle

  integration:
    name: CI / integration
    needs: [build]
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A2AMESH_TEST_REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - run: pnpm run test:integration:no-build

  recovery:
    name: CI / recovery
    needs: [build]
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - run: pnpm run recovery:check
      - run: pnpm run recovery:alerts
      - run: pnpm run recovery:drill
      - name: Upload redacted recovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-evidence-${{ github.run_attempt }}
          path: |
            .artifacts/recovery/recovery-report.json
            .artifacts/recovery/recovery-metrics.prom
            .artifacts/recovery/backups/*.manifest.json
            .artifacts/recovery/diagnostic-bundle/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  performance-smoke:
    name: CI / performance-smoke
    needs: [build]
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: '2.0.0'
      - run: pnpm run perf:smoke:no-build

  conformance:
    name: CI / conformance
    needs: [build]
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - run: pnpm run test:conformance:no-build

  schemas:
    name: CI / schemas
    needs: [build]
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - run: pnpm run schemas:check:no-build

  api-surfaces:
    name: CI / api-surfaces
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm run api:surfaces:check

  mutation:
    name: CI / mutation
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    needs: [identity, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect mutation-relevant changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            changed_files="$(git diff --name-only FETCH_HEAD...HEAD)"
            if grep -Eq '^(packages/|vitest\.config\.ts$|stryker\.config\.json$)' <<< "$changed_files"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "No mutation-relevant changes detected."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - if: steps.changes.outputs.run == 'true'
        run: pnpm run test:mutation

  ui-e2e:
    name: CI / ui-e2e
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    needs: [identity, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - run: pnpm run ui:install:browsers
      - run: pnpm run ui:test:e2e
      - run: pnpm run ui:test:a11y
      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-traces
          path: apps/registry-ui/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: CI / build
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm run build:clean
      - run: pnpm run build:manifest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/build/manifest.json
            packages/*/dist/
            packages/*/tsconfig.tsbuildinfo
            packages/*/node_modules/.cache/tsconfig.tsbuildinfo
            apps/*/dist/
            apps/*/node_modules/.cache/tsconfig.tsbuildinfo
            examples/*/dist/
            examples/*/node_modules/.cache/tsconfig.tsbuildinfo
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  package-dry-run:
    name: CI / package-dry-run
    needs: [build]
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/restore-workspace-build
        with:
          artifact-name: workspace-build-${{ github.sha }}-${{ github.run_attempt }}
      - run: pnpm run pack:dry-run

  dependency-update:
    name: CI / dependency-update
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPENDENCY_UPDATE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - name: Validate workspace lockfile policy
        run: node scripts/check-workspace-declarations.mjs
      - name: Detect repository-managed dependency branch
        id: dependency-update
        run: |
          if [[ "${DEPENDENCY_UPDATE_BRANCH}" == repository-managed-renovate/* ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Not a repository-managed Renovate branch; clean-store dependency validation is an explicit successful no-op."
          fi
      - name: Verify clean checkout has no build artifacts
        if: steps.dependency-update.outputs.run == 'true'
        run: |
          if find packages apps examples -mindepth 2 -maxdepth 2 -type d -name dist -print -quit | grep -q .; then
            echo "Dependency-update validation must start without workspace dist artifacts." >&2
            exit 1
          fi
      - name: Install from isolated empty pnpm store
        if: steps.dependency-update.outputs.run == 'true'
        run: corepack pnpm install --frozen-lockfile --store-dir "${RUNNER_TEMP}/pnpm-store"
      - name: Validate docs and garbage collection without stale build artifacts
        if: steps.dependency-update.outputs.run == 'true'
        run: |
          pnpm run docs:check
          pnpm run clean:build
          pnpm run gc
      - name: Start Redis for dependency integration tests
        if: steps.dependency-update.outputs.run == 'true'
        run: |
          docker run --detach --rm \
            --name a2amesh-dependency-update-redis \
            --publish 6379:6379 \
            redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
          for attempt in {1..30}; do
            if docker exec a2amesh-dependency-update-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs a2amesh-dependency-update-redis >&2
          exit 1
      - name: Build, test, and pack dependency update
        if: steps.dependency-update.outputs.run == 'true'
        run: |
          pnpm run build:clean
          pnpm run test:unit:no-build
          A2AMESH_TEST_REDIS_URL=redis://localhost:6379 pnpm run test:integration:no-build
          pnpm run pack:dry-run
      - name: Stop dependency test Redis
        if: ${{ always() && steps.dependency-update.outputs.run == 'true' }}
        run: docker rm --force a2amesh-dependency-update-redis 2>/dev/null || true

  workspace-graph:
    name: CI / workspace-graph
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - run: node scripts/check-workspace-graph.mjs

  public-surface:
    name: CI / public-surface
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - run: node scripts/check-public-surface.mjs

  command-surface:
    name: CI / command-surface
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - run: node scripts/check-command-surface.mjs

  no-generated-artifacts:
    name: CI / no-generated-artifacts
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - run: node scripts/check-no-generated-artifacts.mjs

  gc:
    name: CI / gc
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm run gc

  mcp-next-compat:
    name: CI / mcp-next-compat (report-only)
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: 'false'
          cache: 'false'
      - run: node scripts/run-mcp-next-compat.mjs --report-only

  compatibility-smoke:
    name: CI / compatibility-smoke (${{ matrix.os }}, node ${{ matrix.node }})
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            node: '22.22.3'
          - os: windows-latest
            runner: windows-latest
            node: '24.16.0'
          - os: macos-latest
            runner: macos-latest
            node: '24.16.0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node }}
      - run: corepack pnpm run toolchain:check
      - run: pnpm run lint:identity

  consumer-smoke:
    name: CI / consumer-smoke (${{ matrix.os }}, node ${{ matrix.node }})
    permissions:
      contents: read
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    needs: [identity]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            node: '22.22.3'
          - os: ubuntu-latest
            runner: ubuntu-latest
            node: '24.16.0'
          - os: windows-latest
            runner: windows-latest
            node: '24.16.0'
          - os: macos-latest
            runner: macos-latest
            node: '24.16.0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/run-consumer-smoke.mjs

  test-evidence:
    name: CI / tests-required
    permissions:
      contents: read
    if: ${{ always() }}
    needs: [unit, integration, recovery, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNIT_RESULT: ${{ needs.unit.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      RECOVERY_RESULT: ${{ needs.recovery.result }}
      CONFORMANCE_RESULT: ${{ needs.conformance.result }}
    steps:
      - name: Verify required test jobs
        run: |
          set -euo pipefail
          for result in "${UNIT_RESULT}" "${INTEGRATION_RESULT}" "${RECOVERY_RESULT}" "${CONFORMANCE_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Required test job failed or was cancelled: ${result}"
              exit 1
            fi
          done
          echo "Required unit, integration, recovery, and conformance tests passed."

  required-summary:
    name: CI / required-summary
    permissions:
      contents: read
    if: ${{ always() }}
    needs:
      - identity
      - install
      - lint
      - typecheck
      - unit
      - integration
      - recovery
      - performance-smoke
      - conformance
      - schemas
      - api-surfaces
      - mutation
      - ui-e2e
      - build
      - package-dry-run
      - dependency-update
      - workspace-graph
      - public-surface
      - command-surface
      - no-generated-artifacts
      - gc
      - compatibility-smoke
      - consumer-smoke
      - test-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: false
          cache: false
      - name: Verify policy-required CI jobs
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-required-summary.mjs
