# Canonical GitHub label source of truth.
# Keep this file aligned with issue forms, .github/labeler.yml, Renovate, and
# docs/development/issue-taxonomy.md. Use `pnpm run labels:preview` before
# `pnpm run labels:apply` when reconciling the live repository.

# Package labels applied automatically to pull requests.
- name: 'pkg:runtime'
  color: '1e40af'
  description: '@a2amesh/runtime and runtime-owned surfaces.'
- name: 'pkg:protocol'
  color: '1d4ed8'
  description: '@a2amesh/protocol schemas and protocol contracts.'
- name: 'pkg:registry'
  color: '2563eb'
  description: '@a2amesh/registry service and discovery surfaces.'
- name: 'pkg:cli'
  color: '93c5fd'
  description: 'a2amesh CLI and command documentation.'
- name: 'pkg:mcp'
  color: '0f766e'
  description: '@a2amesh/mcp bridge and tool-mapping surfaces.'
- name: 'pkg:adapters'
  color: '14b8a6'
  description: 'Provider and framework adapter packages.'
- name: 'pkg:transport-ws'
  color: '3b82f6'
  description: 'WebSocket transport package.'
- name: 'pkg:transport-grpc'
  color: '60a5fa'
  description: 'gRPC transport package.'
- name: 'pkg:testing'
  color: '8b5cf6'
  description: 'Cross-package tests, fixtures, and test infrastructure.'

# Areas describe the affected product or engineering surface.
- name: 'area:ci'
  color: '5319e7'
  description: 'CI workflows, checks, coverage, or status gates.'
- name: 'area:cli'
  color: 'ededed'
  description: 'CLI commands, UX, and command documentation.'
- name: 'area:deployment'
  color: '006b75'
  description: 'Containers, orchestration manifests, environments, and rollout.'
- name: 'area:deps'
  color: 'd97706'
  description: 'Dependency updates and dependency lifecycle policy.'
- name: 'area:docs'
  color: '0e8a16'
  description: 'Documentation, docs-site, architecture docs, or READMEs.'
- name: 'area:dx'
  color: 'a2eeef'
  description: 'Developer experience, examples, onboarding, and local tooling.'
- name: 'area:fleet'
  color: 'bfdadc'
  description: 'Fleet orchestration, workers, providers, or Mission Control.'
- name: 'area:governance'
  color: 'f9d0c4'
  description: 'Branch rules, contribution policy, release policy, or governance.'
- name: 'area:interop'
  color: 'd4c5f9'
  description: 'Interop lab, golden traces, SDK fixtures, or compatibility matrix.'
- name: 'area:mcp'
  color: 'fbca04'
  description: 'MCP bridge, tool mapping, protocol compatibility, and MCP safety.'
- name: 'area:observability'
  color: '0b7285'
  description: 'Metrics, traces, logs, dashboards, alerts, and diagnostics.'
- name: 'area:protocol'
  color: '1d76db'
  description: 'A2A protocol types, schemas, lifecycle, and versioning.'
- name: 'area:registry'
  color: 'bfd4f2'
  description: 'Registry service, discovery, health, tenancy, trust, or API.'
- name: 'area:release'
  color: '0052cc'
  description: 'Release automation, npm, tags, versions, or artifacts.'
- name: 'area:runtime'
  color: 'c2e0c6'
  description: 'Runtime server/client, task management, auth, storage, or middleware.'
- name: 'area:security'
  color: 'ee0701'
  description: 'Threat model, authz, logging, sandboxing, or abuse resistance.'
- name: 'area:storage'
  color: 'c5def5'
  description: 'Persistence, migrations, TTL, audit journals, or artifacts.'
- name: 'area:supply-chain'
  color: '0366d6'
  description: 'SBOM, provenance, dependency review, lockfile, or packaging trust.'
- name: 'area:testing'
  color: '6f42c1'
  description: 'Test strategy, coverage, mutation, fixtures, fuzzing, and gates.'

# Every actionable issue uses exactly one type label.
- name: 'type:adapter'
  color: '14b8a6'
  description: 'Provider or framework adapter integration.'
- name: 'type:bug'
  color: 'd73a4a'
  description: 'Defect, regression, or broken workflow.'
- name: 'type:conformance'
  color: '1d76db'
  description: 'Protocol/spec conformance or compatibility work.'
- name: 'type:docs'
  color: '0e8a16'
  description: 'Documentation or guide work.'
- name: 'type:epic'
  color: '5319e7'
  description: 'Umbrella issue coordinating multiple tasks.'
- name: 'type:feature'
  color: 'a2eeef'
  description: 'New user-facing capability or product behavior.'
- name: 'type:release'
  color: '0052cc'
  description: 'Release, packaging, publishing, or registry work.'
- name: 'type:security'
  color: 'ee0701'
  description: 'Security-sensitive hardening work.'
- name: 'type:task'
  color: '0075ca'
  description: 'Concrete implementation, maintenance, or research task.'

# Priority is assigned during triage, not by public issue forms.
- name: 'priority:P0'
  color: 'b60205'
  description: 'Release blocker or urgent repository-health issue.'
- name: 'priority:P1'
  color: 'd93f0b'
  description: 'Required before the active release train completes.'
- name: 'priority:P2'
  color: 'fbca04'
  description: 'Important follow-up after core stabilization.'
- name: 'priority:roadmap'
  color: 'bfdadc'
  description: 'Strategic roadmap item, not a current release blocker.'

# Status is intentionally small; GitHub issue state and Projects carry the rest.
- name: 'status:blocked'
  color: 'b60205'
  description: 'Blocked by an external dependency, account, or platform state.'
- name: 'status:triaged'
  color: 'ededed'
  description: 'Reviewed and accepted into the active roadmap.'

# Functional collaboration labels are not substitutes for type or status.
- name: 'duplicate'
  color: 'cfd3d7'
  description: 'This issue or pull request already exists.'
- name: 'good first issue'
  color: '7057ff'
  description: 'Suitable for a new contributor with bounded scope.'
- name: 'help wanted'
  color: '008672'
  description: 'Maintainers welcome additional implementation help.'
