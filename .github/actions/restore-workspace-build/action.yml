name: Restore workspace build
description: Restore and verify the commit-scoped workspace build artifact.

inputs:
  artifact-name:
    description: Exact workflow-run artifact name to restore.
    required: true

runs:
  using: composite
  steps:
    - name: Download workspace build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: .
    - name: Verify workspace build
      shell: bash
      run: |
        node scripts/build-artifact-manifest.mjs --verify .artifacts/build/manifest.json
        node scripts/sync-injected-workspace-dist.mjs
