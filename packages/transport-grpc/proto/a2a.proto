syntax = "proto3";

package a2a.v1;

service A2AService {
  rpc GetAgentCard (EmptyRequest) returns (AgentCardResponse);
  rpc GetAuthenticatedExtendedCard (EmptyRequest) returns (AgentCardResponse);
  rpc Health (EmptyRequest) returns (HealthResponse);
  rpc SendMessage (SendMessageRequest) returns (TaskResponse);
  rpc StreamMessage (SendMessageRequest) returns (stream TaskResponse);
  rpc GetTask (TaskRequest) returns (TaskResponse);
  rpc ListTasks (TaskListRequest) returns (TaskListResponse);
  rpc CancelTask (TaskRequest) returns (TaskResponse);
  rpc SubscribeTask (TaskRequest) returns (stream TaskResponse);
  rpc CreatePushNotificationConfig (PushNotificationConfigRequest) returns (PushNotificationConfigResponse);
  rpc GetPushNotificationConfig (PushNotificationConfigRequest) returns (PushNotificationConfigResponse);
  rpc ListPushNotificationConfigs (TaskRequest) returns (PushNotificationConfigListResponse);
  rpc DeletePushNotificationConfig (PushNotificationConfigRequest) returns (DeletePushNotificationConfigResponse);
}

message EmptyRequest {}

message AgentCardResponse {
  string json_card = 1;
}

message HealthResponse {
  string health_json = 1;
}

message SendMessageRequest {
  string message_text = 1;
  string context_id = 2;
  bool return_immediately = 3;
}

message TaskRequest {
  string task_id = 1;
}

message TaskListRequest {
  string context_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message TaskResponse {
  string task_json = 1;
}

message TaskListResponse {
  string task_list_json = 1;
}

message PushNotificationConfigRequest {
  string task_id = 1;
  string config_id = 2;
  string config_json = 3;
}

message PushNotificationConfigResponse {
  string config_json = 1;
}

message PushNotificationConfigListResponse {
  string config_list_json = 1;
}

message DeletePushNotificationConfigResponse {
  bool deleted = 1;
}
