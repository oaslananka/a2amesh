groups:
  - name: a2amesh.runtime.rules
    rules:
      - record: a2amesh:runtime_task_failure_ratio5m
        expr: |
          sum(rate(a2a_runtime_task_failed_total[5m]))
          /
          clamp_min(sum(rate(a2a_runtime_task_started_total[5m])), 1)
      - record: a2amesh:runtime_task_duration_p95_ms5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(a2a_runtime_task_duration_ms_bucket[5m]))
          )
      - alert: A2AMeshRuntimeHighTaskFailureRatio
        expr: a2amesh:runtime_task_failure_ratio5m > 0.05
        for: 10m
        labels:
          severity: warning
          service: a2amesh-runtime
        annotations:
          summary: A2A Mesh runtime task failure ratio is elevated
          description: More than 5% of started tasks have failed during the last 5 minutes.
      - alert: A2AMeshRuntimeNoTaskThroughput
        expr: sum(rate(a2a_runtime_task_started_total[15m])) == 0
        for: 30m
        labels:
          severity: info
          service: a2amesh-runtime
        annotations:
          summary: A2A Mesh runtime has no task throughput
          description: No task started events were observed for 30 minutes. Verify traffic expectations before paging.
      - alert: A2AMeshRuntimeAuthRejectSpike
        expr: sum(rate(a2a_runtime_auth_rejected_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          service: a2amesh-runtime
        annotations:
          summary: A2A Mesh runtime auth rejections increased
          description: Authentication or authorization rejections are sustained above 1 request per second.
      - alert: A2AMeshRuntimeSseConnectionPressure
        expr: sum(a2a_runtime_sse_connections_active) > 500
        for: 15m
        labels:
          severity: warning
          service: a2amesh-runtime
        annotations:
          summary: A2A Mesh runtime has high active SSE connection count
          description: Active SSE connections exceeded the starter threshold. Tune for the deployment size before using in production.
  - name: a2amesh.registry.rules
    rules:
      - record: a2amesh:registry_healthy_agent_ratio
        expr: |
          sum(a2a_registry_healthy_agents)
          /
          clamp_min(sum(a2a_registry_agents), 1)
      - alert: A2AMeshRegistryNoHealthyAgents
        expr: sum(a2a_registry_agents) > 0 and sum(a2a_registry_healthy_agents) == 0
        for: 5m
        labels:
          severity: critical
          service: a2amesh-registry
        annotations:
          summary: A2A Mesh registry has no healthy agents
          description: Registered agents exist but none are currently healthy.
      - alert: A2AMeshRegistryHealthyAgentRatioLow
        expr: a2amesh:registry_healthy_agent_ratio < 0.8
        for: 15m
        labels:
          severity: warning
          service: a2amesh-registry
        annotations:
          summary: A2A Mesh registry healthy agent ratio is low
          description: Less than 80% of registered agents are healthy.
  - name: a2amesh.recovery.rules
    rules:
      - alert: A2AMeshBackupIntegrityFailed
        expr: min by (dataset) (a2a_recovery_backup_integrity_ok) == 0
        for: 1m
        labels:
          severity: critical
          service: a2amesh-recovery
        annotations:
          summary: A2A Mesh backup integrity verification failed
          description: The latest backup for dataset {{ $labels.dataset }} failed hash or SQLite integrity verification.
          runbook_url: https://github.com/oaslananka/a2amesh/blob/main/docs/operations/recovery.md#backup-integrity-failure
      - alert: A2AMeshBackupStale
        expr: time() - max by (dataset) (a2a_recovery_backup_last_success_timestamp_seconds) > 90000
        for: 10m
        labels:
          severity: critical
          service: a2amesh-recovery
        annotations:
          summary: A2A Mesh verified backup is stale
          description: Dataset {{ $labels.dataset }} has no verified backup within the 25-hour alert window.
          runbook_url: https://github.com/oaslananka/a2amesh/blob/main/docs/operations/recovery.md#stale-backup
      - alert: A2AMeshRecoveryRtoExceeded
        expr: max by (dataset) (a2a_recovery_restore_last_duration_seconds) > 1800
        for: 1m
        labels:
          severity: warning
          service: a2amesh-recovery
        annotations:
          summary: A2A Mesh restore exceeded the production RTO target
          description: Dataset {{ $labels.dataset }} took longer than 30 minutes to restore and verify.
          runbook_url: https://github.com/oaslananka/a2amesh/blob/main/docs/operations/recovery.md#rto-exceeded
      - alert: A2AMeshRecoveryDrillFailed
        expr: a2a_recovery_drill_success == 0
        for: 1m
        labels:
          severity: critical
          service: a2amesh-recovery
        annotations:
          summary: A2A Mesh recovery drill failed
          description: The latest disposable backup, restore, or redaction drill did not complete successfully.
          runbook_url: https://github.com/oaslananka/a2amesh/blob/main/docs/operations/recovery.md#recovery-drill-failure
